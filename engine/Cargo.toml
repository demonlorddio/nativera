# nativera Rust workspace.
#
# Member crates are migrated off the C/Python stack in the user-decided order
# consumer -> front-end -> core. `consumer` and `frontend` have landed; `core`
# is added when that migration lands. The shared `target/` sits here (git-ignored).
[workspace]
resolver = "2"
members = ["consumer", "frontend"]

[profile.release]
# The consumer ships in-tree on the bootable distro; keep it small.
strip = "symbols"
lto = "thin"
codegen-units = 1
