# NativeRa Prototype - Limine bootloader config
# Deployed to: ESP/limine.conf AND ESP/EFI/BOOT/limine.conf
#
# SYNTAX (verified against /usr/share/doc/limine/CONFIG.md for Limine 12.9.6):
#   - a menu entry is opened by a line starting with '/' followed by its title
#   - comments start with '#' and may ONLY be on their own lines
#   - options belonging to an entry follow it until the next entry or EOF
#
# NOTE: ':' as an entry opener is Limine 5.x syntax and is silently ignored by
# Limine 12, which reports "config file contains no valid entries". Do not use it.

timeout: 3
default_entry: 1

/ NativeRa Prototype
    protocol: linux
    kernel_path: boot():/vmlinuz
    module_path: boot():/initramfs.cpio.gz
    # CONSOLE ORDER MATTERS. /dev/console maps to the LAST console= on this
    # line. With `console=tty0 console=ttyS0` the last one is the serial port,
    # so init's banner and shell went to a serial port with nothing plugged
    # into it: the kernel log scrolled past (kernel writes to every console),
    # then the screen went black. That is exactly the reported symptom.
    # tty0 MUST be last so /dev/console is the physical screen.
    # ttyS0 stays first so a VM boot can still be read from a serial log.
    cmdline: loglevel=7 rdinit=/init console=ttyS0 console=tty0
