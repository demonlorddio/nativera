# NativeRa Prototype - Limine bootloader config (v12 syntax)
# Deployed to: ESP/limine.conf AND ESP/EFI/BOOT/limine.conf
# Verified against /usr/share/doc/limine/CONFIG.md (limine 12.x)

timeout: 3
default_entry: 1

: NativeRa Prototype
    protocol: linux
    kernel_path: boot():/vmlinuz
    module_path: boot():/initramfs.cpio.gz
    # NOTE: no 'quiet' here. During bring-up the kernel log must be visible so a
    # failure is readable on screen instead of a black screen. Add 'quiet
    # loglevel=3' back once the boot chain is proven.
    cmdline: loglevel=7 rdinit=/init console=tty0
