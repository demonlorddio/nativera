# NativeRa Prototype - Limine bootloader config (v12 syntax)
# Deployed to: ESP/limine.conf AND ESP/EFI/BOOT/limine.conf
# Verified against /usr/share/doc/limine/CONFIG.md (limine 12.x)

timeout: 3

: NativeRa Prototype
    protocol: linux
    kernel_path: boot():/vmlinuz
    module_path: boot():/initramfs.cpio.gz
    cmdline: quiet loglevel=3 rdinit=/init
